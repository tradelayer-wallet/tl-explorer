<a *ngIf="link.length" [routerLink]="link">
  <ng-container *ngTemplateOutlet="outlet" ></ng-container>
</a>
<a *ngIf="isExternal && externalHref" target="_blank" rel="noopener noreferrer" [href]="externalHref">
  <ng-container *ngTemplateOutlet="outlet" ></ng-container>
</a>
<ng-container *ngIf="!link.length && !(isExternal && externalHref)">
  <ng-container *ngTemplateOutlet="outlet" ></ng-container>
</ng-container>
<ng-template #outlet>
   <ng-content></ng-content>
</ng-template>
